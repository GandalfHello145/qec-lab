[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qec-lab"
version = "0.1.0"
description = "Quantum error correction simulations and decoder benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bakir Nahi" }]
dependencies = []

[project.scripts]
qec-lab = "qec_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
